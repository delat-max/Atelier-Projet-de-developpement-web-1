<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NRV.net</title>
    <link rel="stylesheet" href="/css/normalize.css">
    <link rel="stylesheet" href="/css/skeleton.css">
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/api.js" defer></script>
    <script src="/js/main.js" defer></script>
</head>
<body>
    <header class="container">
        <div class="row" style="margin-bottom: 2rem;">
            <div class="six columns">
                <label for="filter-date">Filtrer par date</label>
                <select id="filter-date" class="u-full-width">
                    <option value="">Toutes les dates</option>
                </select>
            </div>
            <div class="six columns">
                <label for="filter-genre">Filtrer par style de musique</label>
                <select id="filter-genre" class="u-full-width">
                    <option value="">Tous les styles</option>
                </select>
            </div>
        </div>
    </header>
    <main class="container">
        <section id="program-view" aria-labelledby="program-title">
            <div class="row">
                <div class="twelve columns">
                    <p>La programmation</p>
                    <h1 id="program-title">Les spectacles</h1>
                    <p>Parcourez les scènes et les soirées du festival.</p>
                </div>
            </div>
            <p id="api-status" role="status" aria-live="polite">Chargement…</p>
            <div id="spectacle-list"></div>
        </section>
        <section id="soiree-view" aria-live="polite" hidden>
            <div class="row">
                <div class="twelve columns">
                    <button id="back-to-program" class="button" type="button">← Toute la programmation</button>
                </div>
            </div>
            <div id="soiree-content"></div>
        </section>
    </main>
</body>
</html>
