<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panier | NRV.net</title>
    <link rel="stylesheet" href="/css/normalize.css">
    <link rel="stylesheet" href="/css/skeleton.css">
    <link rel="stylesheet" href="/css/style.css?v=20261023-1">
    <script src="/js/api.js" defer></script>
    <script src="/js/main.js?v=20261023-1" defer></script>
</head>
<body>
<header class="entete-site">
    <div class="container contenu-entete">
        <div class="row ligne-entete">
            <div class="three columns colonne-logo">
                <a class="lien-logo" href="/" aria-label="NRV.net, accueil"><span class="eclair-logo">⚡</span>NRV<span class="point-logo">.net</span></a>
            </div>
            <div class="five columns recherche-entete ordinateur-seulement">
                <label class="cache-visuellement" for="site-search">Rechercher</label>
                <input id="site-search" class="u-full-width" type="search" placeholder="Rechercher un groupe, une scène, un pass…">
            </div>
            <div class="two columns action-entete ordinateur-seulement">
                <a class="button button-primary bouton-entete" href="/panier.html">Panier ↗</a>
            </div>
            <div class="two columns action-entete ordinateur-seulement">
                <a class="button button-light bouton-entete" href="/profil.html">Profil</a>
            </div>
            <button class="bouton-menu-mobile mobile-seulement" type="button" aria-label="Ouvrir le menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>
    <nav class="menu-mobile" hidden aria-label="Navigation mobile">
        <div class="contenu-menu">
            <div class="haut-menu">
                <span class="fleche-menu" aria-hidden="true">»</span>
                <a class="logo-menu" href="/" aria-label="Accueil"><span>⚡</span>NRV.net</a>
            </div>
            <label class="cache-visuellement" for="mobile-search">Rechercher</label>
            <input id="mobile-search" class="u-full-width recherche-menu" type="search" placeholder="Rechercher un groupe, une scène, un pass…">
            <a class="button button-primary bouton-menu" href="/panier.html">Panier</a>
            <a class="button button-light bouton-menu" href="/profil.html">Profil</a>
        </div>
    </nav>
</header>
<main class="container cadre-page contenu-page">
    <h1 class="titre-page">Votre Panier</h1>
    <!-- Ici banderole pass 3j -->
        <section class="banniere-action-soiree" id="banniere-pass-3j" style="margin-bottom: 2.4rem;">
            <div class="contenu-banniere">
                <div>
                    <p class="surtitre" style="margin-bottom: 0.4rem;">⚡ OFFRE SPÉCIALE FESTIVAL</p>
                    <h2 style="margin: 0 0 0.5rem 0; font-size: 2.2rem;">Pass 3 Jours NRV</h2>
                    <p class="texte-discret" style="margin: 0;">
                        Vivez 3 soirées au choix et bénéficiez de <strong>-3 % de remise immédiate</strong> sur le tarif triple.
                    </p>
                </div>
                <div class="actions-billetterie" style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                    <select id="select-soiree-pass" class="u-full-width" style="max-width: 260px; margin-bottom: 0;" aria-label="Choisir la soirée de référence pour le Pass 3 jours">
                        <option value="1" data-nom="Legendes du hard rock" data-date="2026-11-06" data-lieu="L'Autre Canal, Nancy" data-prix="32" data-places="850">Week-end 1 · Dès le 6 nov. (93,12 €)</option>
                        <option value="4" data-nom="Metal moderne" data-date="2026-11-13" data-lieu="L'Autre Canal, Nancy" data-prix="35" data-places="850">Week-end 2 · Dès le 13 nov. (101,85 €)</option>
                        <option value="7" data-nom="Rock des annees 80" data-date="2026-11-20" data-lieu="L'Autre Canal, Nancy" data-prix="30" data-places="850">Week-end 3 · Dès le 20 nov. (87,30 €)</option>
                        <option value="10" data-nom="Metal francais" data-date="2026-11-27" data-lieu="L'Autre Canal, Nancy" data-prix="34" data-places="850">Week-end 4 · Dès le 27 nov. (98,94 €)</option>
                    </select>
                    <button class="button button-primary" type="button" id="btn-ajouter-pass-3j">
                        + Ajouter le Pass 3 Jours
                    </button>
                </div>
            </div>
        </section>
    <div class="row mise-en-page-panier">
        <section class="twelve columns liste-panier" aria-label="Articles du panier">
            <p id="etat-panier" role="status" aria-live="polite"></p>
            <div id="panier-content"></div>
        </section>
        <div class="resume-panier" aria-labelledby="panier-summary-title">
            <p id="panier-summary-title">Total <strong id="total-panier">0 €</strong></p>
            <button class="button button-primary bouton-payer" type="button" disabled>Payer ↗</button>
        </div>
    </div>
</main>
</body>
</html>
