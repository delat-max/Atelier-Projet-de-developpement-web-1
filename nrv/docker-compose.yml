services:
  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: nrv_db
      DB_USER: nrv
      DB_PASSWORD: nrv
      ADMIN_EMAILS: admin@nrv.net
    depends_on:
      db:
        condition: service_healthy

  front:
    restart: unless-stopped
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/front/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  db:
    restart: unless-stopped
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nrv_db
      MYSQL_USER: nrv
      MYSQL_PASSWORD: nrv
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
